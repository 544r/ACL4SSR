[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则 - 低误杀 & 防DNS泄露优化版

;去广告：支持（anti-AD 移至国内白名单后，彻底杜绝国内业务误杀）
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：不支持
;增强国外GFW：不支持

; --- 规则集列表 (Rulesets) ---

; 【第0梯队：自有域名、内网穿透与局域网】
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,wzu.edu.cn
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,662228.xyz

; 【第1梯队：国内关键生产力特赦白名单】
; 因严格开启 no-resolve，必须在最顶层精确放行豆包及火山引擎对象存储（TOS），防止被误判为漏网之鱼出海
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,doubao.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volces.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volccdn.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volcengine.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ibytedtos.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,bytecdntp.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,byteimg.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,zijieapi.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,bytedance.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,snssdk.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,pstatp.com

; 【第2梯队：关键指定服务分流（国内直连 + 境外常用）】
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/GoogleCN.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,rules/ACL4SSR/Clash/Microsoft.list
ruleset=🍎 苹果服务,rules/ACL4SSR/Clash/Apple.list
ruleset=🌍 国外媒体,rules/ACL4SSR/Clash/ProxyMedia.list
ruleset=📲 电报信息,rules/ACL4SSR/Clash/Telegram.list
ruleset=🚀 节点选择,rules/ACL4SSR/Clash/ProxyLite.list

; 【第3梯队：全量国内域名大名单直连】
; 核心调整：必须移到 anti-AD 前面！先保障国内所有正常 Web/App 的通信与风控握手
ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt

; 【第4梯队：去广告 anti-AD】
; 移至国内规则之后，只拦截境外或未知流氓广告，不再有权限误杀国内正常业务数据
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/anti-ad-surge.txt

; 【第5梯队：纯 IP 规则及最终防泄露兜底】
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/ChinaCompanyIp.list
; 严格保留 no-resolve，坚决不向本地 DNS 解析未知域名，杜绝 DNS 泄露
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

; --- 策略组 (Proxy Groups) ---
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🎯 全球直连`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择

; 广告拦截默认 REJECT，命中 anti-AD 就拒绝；如果极少数情况仍有误杀，可一键切到 DIRECT
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`
