[custom]
; ACL4SSR-pc-use.ini - 通用 PC 端精简分流规则（不硬编码任何特定节点名，适配任意订阅，零 url-test）

; --- 规则集列表 (Rulesets) ---

; 【第0梯队：局域网域名与内网IP（192.168/10/172段）+ 个人自定义直连与自建】
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,PRIVATE,no-resolve
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,wzu.edu.cn
ruleset=🏠 自建服务,[]DOMAIN-SUFFIX,662228.xyz

; 【第一梯队：个人核心白名单（防豆包上传与火狐商店误杀）】
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,doubao.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volces.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volccdn.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volcengine.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ibytedtos.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,bytecdntp.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,byteimg.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,zijieapi.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,bytedance.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,snssdk.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,pstatp.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,mozilla.org

; 【第二梯队：官方社区每日维护的核心海外业务（AI / Meta鉴权 / Discord / YouTube / Google / GitHub）】
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
; 统一 Meta / Facebook 鉴权出口与 Meta Muse 走同一策略组，防止登录态跨国分裂
ruleset=🤖 AI服务,[]GEOSITE,facebook
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,muse.ai
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,museai.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,metaaivm.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,meta.com
ruleset=🤖 AI服务,[]DOMAIN,meta-ohttp-config-prod.fastly-edge.com
ruleset=🤖 AI服务,[]DOMAIN,meta-ohttp-relay-prod.fastly-edge.com

ruleset=💬 Discord,[]GEOSITE,discord
ruleset=📺 YouTube,[]GEOSITE,youtube
ruleset=🔍 谷歌服务,[]GEOSITE,google
; GitHub 必须排在 microsoft 之前（因为微软官方 geosite 包含 GitHub，放后面会被微软直连截胡）
ruleset=🚀 节点选择,[]GEOSITE,github

; 微软/苹果/Steam 中国区直连（官方社区维护）
ruleset=🎯 全球直连,[]GEOSITE,microsoft@cn
ruleset=🎯 全球直连,[]GEOSITE,apple@cn
ruleset=🎯 全球直连,[]GEOSITE,steam@cn

; 【第三梯队：去广告（官方每日自动构建 anti-AD，置于白名单与核心业务之后、国内全量之前）】
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/anti-ad-surge.txt

; 【第四梯队：日常海外服务（全官方社区 GEOSITE）】
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=📲 电报信息,[]GEOSITE,telegram
ruleset=🌍 国外媒体,[]GEOSITE,netflix
ruleset=🌍 国外媒体,[]GEOSITE,tiktok
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn

; 【第五梯队：国内全量直连 + 纯 IP 段精准封口（全带 no-resolve 防 DNS 泄露）】
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🔍 谷歌服务,[]GEOIP,GOOGLE,no-resolve
ruleset=📲 电报信息,[]GEOIP,TELEGRAM,no-resolve
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

; --- 策略组 (Proxy Groups) ---
custom_proxy_group=🚀 节点选择`select`.*
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`.*
custom_proxy_group=🔍 谷歌服务`select`[]🚀 节点选择`.*
custom_proxy_group=💬 Discord`select`[]🚀 节点选择`.*
custom_proxy_group=🏠 自建服务`select`[]🚀 节点选择`.*
custom_proxy_group=📺 YouTube`select`[]🚀 节点选择`.*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`.*
