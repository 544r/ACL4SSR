[custom]
; ACL4SSR-pc-use.ini - PC 端纯业务解耦双节点版（无地区硬编码、无个人小仓库依赖、jsDelivr 加速防后端超时）
; 使用建议：面板中将 🚀 节点选择 选为日本 Azure；将 🤖 AI服务 / 🔍 谷歌服务 / 🏠 自建服务 选为美国原生 PPF-V4

; --- 规则集列表 (Rulesets) ---

; 【第0梯队：局域网、校园网直连与自建服务】
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,wzu.edu.cn
ruleset=🏠 自建服务,[]DOMAIN-SUFFIX,662228.xyz

; 【第一梯队：国内核心白名单（防豆包/火山引擎被去广告误杀）+ AI 服务 + YouTube + 谷歌全家桶】
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,doubao.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volces.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volccdn.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,volcengine.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ibytedtos.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,bytecdntp.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,byteimg.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,zijieapi.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,bytedance.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,snssdk.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,pstatp.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,mozilla.org

; AI 服务（含 OpenAI / Claude / Gemini / Meta Muse / Cursor / Grok / Perplexity）
ruleset=🤖 AI服务,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/OpenAi.list
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,muse.ai
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,claude.ai
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,ai.google.dev
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,deepmind.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,deepmind.google
ruleset=🤖 AI服务,[]DOMAIN-KEYWORD,alkalimakersuite
ruleset=🤖 AI服务,[]DOMAIN-KEYWORD,robinfrontend
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,perplexity.ai
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,x.ai
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,grok.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,cursor.sh
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,cursor.com

; YouTube 独立分流（置于谷歌之前，可按需切日本看 4K 或切美国保号）
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,youtube.com
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,youtu.be
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,ytimg.com
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,ggpht.com
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,yt.be
ruleset=📺 YouTube,[]DOMAIN-SUFFIX,youtubei.googleapis.com

; Google 全家桶（账号/Gmail/Play/Drive/搜索统一出口，防止跨国横跳）
ruleset=🔍 谷歌服务,[]GEOSITE,google

; 关键国内直连服务
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/SteamCN.list

; 【第二梯队：去广告 anti-AD（置于核心白名单与 AI/谷歌之后、CN 全量之前）】
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/anti-ad-surge.txt

; 【第三梯队：日常海外服务】
ruleset=Ⓜ️ 微软服务,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Apple.list
ruleset=🌍 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyMedia.list
ruleset=📲 电报信息,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Telegram.list
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyLite.list

; 【第四梯队：国内全量直连】
ruleset=🎯 全球直连,[]GEOSITE,CN

; 【第五梯队：纯 IP 规则与防 DNS 泄露兜底】
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

; --- 策略组 (Proxy Groups) ---
; 纯业务分组、全手动 select（无后台自动测速），节点出口完全由你在面板按需指定
custom_proxy_group=🚀 节点选择`select`.*`[]DIRECT
custom_proxy_group=🤖 AI服务`select`.*`[]🚀 节点选择`[]🎯 全球直连
custom_proxy_group=🔍 谷歌服务`select`.*`[]🚀 节点选择`[]🎯 全球直连
custom_proxy_group=🏠 自建服务`select`.*`[]🚀 节点选择`[]🎯 全球直连
custom_proxy_group=📺 YouTube`select`[]🚀 节点选择`.*`[]🎯 全球直连
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`.*`[]🎯 全球直连
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`.*`[]🎯 全球直连
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`.*
