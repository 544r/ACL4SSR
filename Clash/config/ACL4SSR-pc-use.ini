[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持（已替换为 anti-AD，关键服务优先，降低误杀）
;自动测速：已禁用（防止触发校园网交换机高频并发风控）
;微软分流：支持
;苹果分流：支持
;增强中国IP段：不支持
;增强国外GFW：不支持

; --- 规则集列表 (Rulesets) ---

; 【第0梯队：自有域名、温大内网、局域网】
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,wzu.edu.cn
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,662228.xyz
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,sily.662228.xyz
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,api.662228.xyz

; 【第一梯队：关键服务分流】
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/GoogleCN.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,rules/ACL4SSR/Clash/Microsoft.list
ruleset=🍎 苹果服务,rules/ACL4SSR/Clash/Apple.list
ruleset=🌍 国外媒体,rules/ACL4SSR/Clash/ProxyMedia.list
ruleset=📲 电报信息,rules/ACL4SSR/Clash/Telegram.list
ruleset=🚀 节点选择,rules/ACL4SSR/Clash/ProxyLite.list

; 【第二梯队：去广告 anti-AD】
ruleset=🛡️ 广告拦截,https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/anti-ad-surge.txt

; 【第三梯队：大范围国内域名直连】
ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt

; 【第四梯队：纯 IP 规则及最终兜底】
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

; --- 策略组 (Proxy Groups) ---
; 1. 移除自动测速组，默认采用手动选择节点，杜绝后台并发探测
custom_proxy_group=🚀 节点选择`select`.*`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

; 广告拦截
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT`[]DIRECT

; 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连
